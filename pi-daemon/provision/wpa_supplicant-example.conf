# Vi du cau hinh WPA2-Enterprise (PEAP/MSCHAPv2) cho wpa_supplicant tren
# Raspberry Pi OS - day la phan "ket noi mang" tren Linux, KHONG can tu viet
# code (khac han ESP32 phai tu goi esp_eap_client trong C). Copy noi dung
# nay vao /etc/wpa_supplicant/wpa_supplicant-wlan0.conf, doi identity/
# password khop voi dong trong bang teams (identity = teams.username, password
# = mat khau GOC dung de NtHashGen sinh nt_hash - KHONG phai chinh nt_hash).
ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
update_config=1
country=VN

network={
    ssid="TEN_SSID_GIAI_DAU"
    key_mgmt=WPA-EAP
    eap=PEAP
    identity="team01"           # doi thanh teams.username cua doi nay
    password="mat_khau_goc_doi" # mat khau GOC, khop voi nt_hash trong DB
    phase2="auth=MSCHAPV2"
    priority=1
}

# Kich hoat (mot lan):
#   sudo cp wpa_supplicant-example.conf /etc/wpa_supplicant/wpa_supplicant-wlan0.conf
#   sudo systemctl enable wpa_supplicant@wlan0
#   sudo systemctl start wpa_supplicant@wlan0
# Kiem tra da len mang chua:
#   iwconfig wlan0        # thay ESSID/Access Point da co
#   ip addr show wlan0    # thay co IP
# Neu FreeRADIUS tu choi (SSID khong len mang), kiem tra:
#   - teams.is_active co dang = true khong (bi revoke thi tu choi ngay)
#   - identity/password co khop dung dong trong bang teams khong
#   - mac_address (neu BTC co gioi han 1 may/doi) co khop MAC cua Pi nay khong
